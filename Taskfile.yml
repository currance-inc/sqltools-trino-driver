version: '3'

vars:
  VSIX_NAME: currance-inc-sqltools-trino-driver-0.2.13-currance.1.vsix
  NODE_BIN: '{{default "node" .NODE_BIN}}'

tasks:
  clean:
    desc: Remove build outputs and packaged artifacts
    cmds:
      - rm -rf out *.vsix

  build:
    desc: Build the extension bundles in a portable way
    cmds:
      - npm install
      - npm run esbuild
      - cp package.json ./out/ls

  package-vsix:
    desc: Build and package the VSIX artifact without hardcoded machine paths
    cmds:
      - task: build
      - |
        if [ "{{.NODE_BIN}}" = "node" ]; then
          npx @vscode/vsce package --allow-star-activation --no-yarn
        elif [ -x "{{.NODE_BIN}}" ]; then
          "{{.NODE_BIN}}" ./node_modules/vsce/vsce package --allow-star-activation --no-yarn
        else
          npx @vscode/vsce package --allow-star-activation --no-yarn
        fi
      - test -f {{.VSIX_NAME}}

  build-vsix:
    desc: Alias for package-vsix
    cmds:
      - task: package-vsix
